<main class="auth">
  <section class="auth__card">
    <div class="auth__content">
      <p class="auth__label">{{ 'auth.login' | translate }}</p>
      <h1 class="auth__title">{{ 'auth.loginAccount' | translate }}</h1>
      <form [formGroup]="authForm" class="auth__form">
        <div class="auth__field">
          <label for="username">{{ 'auth.userName' | translate }}</label>
          <input formControlName="username" class="auth__input" id="username" type="username"
            [placeholder]="'auth.authInputUserName' | translate" />
        </div>
        <div class="auth__field">
          <label for="password">{{ 'auth.userPassword' | translate }}</label>
          <input formControlName="password" class="auth__input" id="password" type="password"
            [placeholder]="'auth.authInputPassword' | translate" />
        </div>
        <button (click)="onAuthForm()" class="auth__submit" type="submit">{{ 'auth.btnLogin' | translate }}</button>
      </form>
    </div>
    <aside class="auth__panel">
      <div class="auth__panel-top">
        <app-language mode="auth" />
        <span class="auth__panel-label">{{ 'auth.mentoringName' | translate }}</span>
      </div>
      <h2>{{ 'auth.title' | translate }}</h2>
      <p>{{ 'auth.desc' | translate }}</p>
    </aside>
  </section>
</main>
