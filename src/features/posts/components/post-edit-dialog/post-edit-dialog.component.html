<form [formGroup]="editPostForm" class="card flex justify-center">
  <span class="p-text-secondary block mb-8">{{ 'postsPage.editDialog.prompt' | translate }}</span>
  <div class="flex items-center gap-4 mb-4">
    <label for="title" class="font-semibold w-24">{{ 'postsPage.editDialog.title' | translate }}</label>
    <input formControlName="title" pInputText id="title" class="flex-auto" autocomplete="off" />
  </div>
  <div class="flex items-center gap-4 mb-8">
    <label for="tags" class="font-semibold w-24">{{ 'postsPage.editDialog.tags' | translate }}</label>
    <input formControlName="tags" pInputText id="tags" class="flex-auto" autocomplete="off" />
  </div>
  <div class="flex items-center gap-4 mb-8">
    <label for="views" class="font-semibold w-24">{{ 'postsPage.editDialog.views' | translate }}</label>
    <input formControlName="views" pInputText id="views" class="flex-auto" autocomplete="off" />
  </div>
  <div class="flex justify-end gap-2">
    <p-button [label]="'postsPage.editDialog.cancel' | translate" severity="secondary" (onClick)="closeModal()" />
    <p-button [label]="'postsPage.editDialog.save' | translate" (onClick)="onEditPost()" />
  </div>
</form>
