<form class="form__wrapper" [formGroup]="userForm">
  <div class="form__title">
    <h2 class="form__heading">{{ 'usersPage.createUser.title' | translate }}</h2>
  </div>
  <div class="form__section user-info">
    <div class="form__columns">
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="name">{{ 'usersPage.createUser.name' | translate }}</label>
          <input animatedBorder class="form__input" id="name" type="text" formControlName="name"
            [placeholder]="'usersPage.createUser.namePlaceholder' | translate" />
        </div>
      </div>
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="username">{{ 'usersPage.createUser.username' | translate }}</label>
          <input animatedBorder class="form__input" id="username" type="text" formControlName="username"
            [placeholder]="'usersPage.createUser.usernamePlaceholder' | translate" />
        </div>
      </div>
    </div>
  </div>
  <div class="form__section contact">
    <h3 class="form__section-title">{{ 'usersPage.createUser.contacts' | translate }}</h3>
    <div class="form__columns">
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="email">{{ 'usersPage.createUser.email' | translate }}</label>
          <input animatedBorder class="form__input" id="email" type="email" formControlName="email"
            placeholder="example@email.com" />
        </div>
      </div>
      <div class="form__divider"></div>
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="phone">{{ 'usersPage.createUser.phone' | translate }}</label>
          <input animatedBorder class="form__input" id="phone" type="tel" formControlName="phone"
            [placeholder]="'usersPage.createUser.phonePlaceholder' | translate" />
        </div>
      </div>
      <div class="form__divider"></div>
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="website">{{ 'usersPage.createUser.website' | translate }}</label>
          <input animatedBorder class="form__input" id="website" type="url" formControlName="website"
            placeholder="example.com" />
        </div>
      </div>
    </div>
  </div>
  <div class="form__section address" formGroupName="address">
    <h3 class="form__section-title">{{ 'usersPage.createUser.address' | translate }}</h3>
    <div class="form__columns">
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="city">{{ 'usersPage.createUser.city' | translate }}</label>
          <input animatedBorder class="form__input" id="city" type="text" formControlName="city"
            [placeholder]="'usersPage.createUser.cityPlaceholder' | translate" />
        </div>
      </div>
      <div class="form__divider"></div>
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="street">{{ 'usersPage.createUser.street' | translate }}</label>
          <input animatedBorder class="form__input" id="street" type="text" formControlName="street"
            [placeholder]="'usersPage.createUser.streetPlaceholder' | translate" />
        </div>
      </div>
      <div class="form__divider"></div>
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="suite">{{ 'usersPage.createUser.suite' | translate }}</label>
          <input animatedBorder class="form__input" id="suite" type="text" formControlName="suite"
            [placeholder]="'usersPage.createUser.suitePlaceholder' | translate" />
        </div>
      </div>
    </div>
    <div class="form__columns">
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="zipcode">{{ 'usersPage.createUser.zipcode' | translate }}</label>
          <input animatedBorder class="form__input" id="zipcode" type="text" formControlName="zipcode"
            [placeholder]="'usersPage.createUser.zipcodePlaceholder' | translate" />
        </div>
      </div>
      <div class="form__divider"></div>
      <div class="form__column" formGroupName="geo">
        <div class="form__group">
          <label class="form__label" for="lat">{{ 'usersPage.createUser.lat' | translate }}</label>
          <input animatedBorder class="form__input" id="lat" type="number" formControlName="lat"
            [placeholder]="'usersPage.createUser.latPlaceholder' | translate" />
        </div>
      </div>
      <div class="form__divider"></div>
      <div class="form__column" formGroupName="geo">
        <div class="form__group">
          <label class="form__label" for="lng">{{ 'usersPage.createUser.lng' | translate }}</label>
          <input animatedBorder class="form__input" id="lng" type="number" formControlName="lng"
            [placeholder]="'usersPage.createUser.lngPlaceholder' | translate" />
        </div>
      </div>
    </div>
  </div>
  <div class="form__section company">
    <h3 class="form__section-title">{{ 'usersPage.createUser.company' | translate }}</h3>
    <div class="form__columns" formGroupName="company">
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="company-name">{{ 'usersPage.createUser.companyName' | translate }}</label>
          <input animatedBorder class="form__input" id="company-name" type="text" formControlName="name"
            [placeholder]="'usersPage.createUser.companyNamePlaceholder' | translate" />
        </div>
      </div>
      <div class="form__divider"></div>
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="catchphrase">{{ 'usersPage.createUser.catchphrase' | translate }}</label>
          <input animatedBorder class="form__input" id="catchphrase" type="text" formControlName="catchPhrase"
            [placeholder]="'usersPage.createUser.catchphrasePlaceholder' | translate" />
        </div>
      </div>
      <div class="form__divider"></div>
      <div class="form__column">
        <div class="form__group">
          <label class="form__label" for="bs">{{ 'usersPage.createUser.bs' | translate }}</label>
          <input animatedBorder class="form__input" id="bs" type="text" formControlName="bs"
            [placeholder]="'usersPage.createUser.bsPlaceholder' | translate" />
        </div>
      </div>
    </div>
  </div>
  <button fontWeightHover class="form__button" type="submit" (click)="submitUserForm()">
    {{ 'usersPage.createUser.submit' | translate }}
  </button>
</form>
